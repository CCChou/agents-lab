# Copy to config/config.toml (ignored by git) and pass it with --config or AGENT_CONFIG (D-038).
# The container reads config/ as /etc/agent/ (D-039).
# Secrets stay in the environment: AGENT_LLM_API_KEY, MINIFLUX_API_KEY, SLACK_WEBHOOK_URL.

# debug = true                      # log at debug level

[llm]
base_url = "https://api.openai.com/v1"  # any OpenAI-compatible Chat Completions API
model = "gpt-6-luna"
# reasoning_effort = "none"         # sent only when set (D-023)
# temperature = 0.2                 # sent only when set
# system_prompt = "..."             # replaces the rss agent's prompt

[miniflux]
base_url = "https://miniflux.example.com"
# ca_bundle = "/etc/ssl/miniflux-ca.pem"
# verify_ssl = false

# Optional. Each [jobs.<name>] runs with POST /jobs/<name>/run and is re-read on every run (D-037).
# channels lists notifiers configured in the service: "slack" needs SLACK_WEBHOOK_URL.
[jobs.daily-digest]
prompt = "過去 24 小時的科技和新聞趨勢，各推薦最多 5 篇值得讀的文章"
channels = ["slack"]
