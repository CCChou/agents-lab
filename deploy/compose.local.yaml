# Run from the repo root (D-040): docker compose -f deploy/compose.local.yaml up -d --build
# Builds the image on this machine instead of pulling it, to try a change before pushing.
# Same secrets, config and port as prod. Paths are relative to this file.
name: agents-lab-local
services:
  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: agents-lab:local
    # Secrets only, as KEY=VALUE lines (D-038).
    env_file: ../prod.env
    environment:
      TZ: Asia/Taipei
    volumes:
      - ../config:/etc/agent:ro
    ports:
      - "127.0.0.1:8000:8000"
