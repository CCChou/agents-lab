# Run from the repo root (D-039): docker compose -f deploy/compose.prod.yaml up -d
# Pulls the image pushed to GHCR; follow docs/deploy-pipeline.md. Paths are relative to this file.
# AGENT_IMAGE_TAG picks a commit's image while deploying; latest is the last verified one.
name: agents-lab
services:
  agent:
    image: ghcr.io/ccchou/agents-lab:${AGENT_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Secrets only, as KEY=VALUE lines (D-038).
    env_file: ../prod.env
    environment:
      TZ: Asia/Taipei
    # A directory, not a single file: editors that save by replacing the file would leave the
    # container reading the old copy, and [jobs] edits must show up without a restart (D-037).
    volumes:
      - ../config:/etc/agent:ro
    # Only this host, where cron runs. Docker bypasses ufw, so "8000:8000" opens it to the LAN.
    ports:
      - "127.0.0.1:8000:8000"
